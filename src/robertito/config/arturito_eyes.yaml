arturito_eyes:
  ros__parameters:
    i2c_bus: 1
    left_address: 0x3C
    right_address: 0x3D
    driver: sh1106
    default_expression: normal
    enable_auto_blink: true
    blink_interval_sec: 7.0
    blink_duration_sec: 0.15
    mirror_right: false
    brightness: 200
    person_detection_topic: arturito/camera/faces
    person_expression: happy
    person_timeout_sec: 1.0
    sleep_expression: sleeping
    light_state_topic: ''
    light_state_inverted: false
    light_level_topic: arturito/camera/brightness
    dark_threshold: 40.0
