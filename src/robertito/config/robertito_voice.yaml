voice_synth_node:
  ros__parameters:
    input_topic: /assistant/say
    voice_mode: jarvis
    language: es-AR

    tts_provider: elevenlabs

    # ElevenLabs config (voz "Will" — joven, cálida)
    elevenlabs_voice_id: "bIHbv24MWmeRgasZH58o"
    elevenlabs_model_id: "eleven_multilingual_v2"
    elevenlabs_api_key_file: "/home/robot/.config/robertito/elevenlabs.env"
    fallback_tts_provider: piper

    supports_ssml: false
    use_ssml: false
    enable_ssml: false

    # Salida de audio: ALSA directo al parlante USB (bypass PipeWire/PulseAudio/BT).
    # plughw:CARD=Device,DEV=0 referencia el parlante USB por nombre de card
    # (estable aunque cambie el orden de enumeración USB entre arranques).
    # Si el device no existe en runtime, el nodo cae automáticamente a "default".
    audio_backend: alsa
    audio_device: plughw:CARD=Device,DEV=0
    play_command: "internal"

    # Configuración explícita opcional. Si está presente, sobrescribe los
    # flat audio_backend/audio_device de arriba. Útil para alternar entre
    # USB (voz) y BT (música) sin tocar el resto del archivo.
    audio_output:
      backend: alsa
      device: plughw:CARD=Device,DEV=0

    rate: 1.0
    pitch: "0"

    piper_dir: /home/robot/ros2_ws/piper
    piper_sentence_silence: 0.12

    cache_enabled: true

    # Pre-pad de silencio antes de cada frase si el stream estuvo idle.
    # Con ALSA directo el wake-up del speaker USB es prácticamente
    # instantáneo, pero mantenemos un margen pequeño para no cortar la
    # primera sílaba en transiciones de stream.
    lead_in_silence_s: 0.5
    lead_in_idle_threshold_s: 3.0
