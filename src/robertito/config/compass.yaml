compass_node:
  ros__parameters:
    i2c_bus: 1
    i2c_address: 0x0d
    sensor_model: "qmc5883l"  # auto|qmc5883l|hmc5883l|lis3mdl
    frame_id: "base_link"

    publish_rate_hz: 20.0

    # Output topic /robertito/compass/yaw publishes degrees in (-180, 180].
    yaw_output_mode: "-180_180"
    yaw_offset_deg: 0.0
    yaw_sign: 1.0
    declination_deg: 0.0

    # Magnetometer calibration. If an external calibration file exists, map its
    # hard-iron center offsets and soft-iron XY scale into these parameters.
    hard_iron_offset_x: 0.0
    hard_iron_offset_y: 0.0
    soft_iron_scale_x: 1.0
    soft_iron_scale_y: 1.0

    lowpass_alpha: 0.25
    median_window: 5

    angular_tolerance_deg: 5.0
    deadband_deg: 1.5
    stale_timeout_sec: 0.5
    max_jump_deg: 45.0
